# Builds an unsigned PiOS.ipa for sideloading (SideStore/AltStore re-sign it
# on the device), and runs the Swift core's tests on the way.
name: ios

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/ios/**"
      - "spikes/traces/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: write

jobs:
  ipa:
    # The iOS 27 SDK: Liquid Glass on bars, menus and sheets, and the
    # glassEffect APIs. Preview image; macos-26 (Xcode 26) also builds.
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Core tests
        run: swift test --package-path PiOSCore

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          # The exit status is xcodebuild's: a half-built .app must never ship.
          set -o pipefail
          xcodebuild \
            -project PiOS.xcodeproj -scheme PiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -50; exit 1; }
          grep -E "warning:|BUILD" build.log | sort -u | head -50

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PiOS.app Payload/
          zip -qry PiOS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PiOS-ipa
          path: apps/ios/PiOS.ipa

      # A fixed URL a phone can open: .../releases/download/ios-latest/PiOS.ipa
      - name: Publish ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --cleanup-tag -y || true
          gh release create ios-latest PiOS.ipa --prerelease --target "$GITHUB_SHA" \
            --title "PiOS iOS (latest build)" \
            --notes "Unsigned build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Sideload with SideStore or AltStore."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: apps/ios/build.log
