# XcodeGen spec. The .xcodeproj is generated, never committed:
#   brew install xcodegen && xcodegen generate
name: PiOS
options:
  bundleIdPrefix: dev.pios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here or with `xcodebuild DEVELOPMENT_TEAM=...` for a device build.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  PiOSCore:
    path: PiOSCore
  # Terminal emulator for the shell tab (MIT), the native counterpart of
  # the PWA's xterm.js.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3

targets:
  PiOS:
    type: application
    platform: iOS
    sources:
      - path: PiOS
    dependencies:
      - package: PiOSCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pios.app
        PRODUCT_NAME: PiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: PiOS/Info.plist
      properties:
        CFBundleDisplayName: PiOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # `pios://host/#pt=...` opens the pairing sheet with the link filled in.
        CFBundleURLTypes:
          - CFBundleURLName: dev.pios.pair
            CFBundleURLSchemes: [pios]
        NSCameraUsageDescription: Scan pairing QR codes, and take photos to send to the agent.
        # The relay is HTTPS; a daemon on the LAN during development is not.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reach a PiOS daemon on your local network during development.

schemes:
  PiOS:
    build:
      targets:
        PiOS: all
    run:
      config: Debug
    archive:
      config: Release
